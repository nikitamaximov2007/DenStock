# Ключ подписи манифестов монтируется только для чтения и живёт вне репозитория.
# Каталог /etc/denstock не попадает ни в образ, ни в Git, ни в архив бэкапа:
# в бэкап уходят только ./backups и тома media, поэтому приватный ключ туда не
# копируется. Плановый бэкап заходит в этот же работающий контейнер, значит
# монтирование обязано быть у самого сервиса, а не у разовой команды.
services:
  web:
    volumes:
      - /etc/denstock/manifest-signing:/etc/denstock/manifest-signing:ro
