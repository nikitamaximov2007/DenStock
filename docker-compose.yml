services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data      # данные сохраняются между перезапусками
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # .env.max-webhook (root, mode 600) carries only MAX_WEBHOOK_ENABLED and
    # MAX_WEBHOOK_SECRET: web authenticates MAX's webhook and needs nothing more.
    # Absent file means the webhook answers 404 to everything.
    env_file:
      - path: .env
      - path: .env.max-webhook
        required: false
    environment:
      # Receiving a webhook needs no API call: web never holds the MAX token.
      MAX_BOT_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media:/app/mediafiles          # загруженные фото сохраняются между пересборками
      - private_media:/app/private_media # приватные скриншоты ИИ; не подключать к proxy
      - ./backups:/app/backups         # бэкапы видны на хосте (Слой 25)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Started only with `--profile public-catalog`.  This service never receives
  # the internal .env, media volumes, backup directory or signing-key mount.
  catalog-web:
    profiles: ["public-catalog"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["/public-entrypoint.sh"]
    # Threaded workers: a slow typo search must not block the whole process.
    # Measured locally on the 125k corpus: 2 sync workers saturate near
    # 60 req/s; 3 workers x 2 threads with persistent connections reach about
    # 125 req/s with zero errors, holding 6 database connections. Worker
    # memory stayed flat, so workers are not recycled: a recycle drops open
    # keep-alive connections mid-request.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --worker-class=gthread
      - --workers=${CATALOG_WEB_WORKERS:-3}
      - --threads=${CATALOG_WEB_THREADS:-2}
      - --timeout=60
    env_file: .env.public
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.public
      # The deep link needs only MAX_BOT_USERNAME (in .env.public). Never a secret;
      # config/settings/public.py empties these again as a second line.
      MAX_BOT_TOKEN: ""
      MAX_WEBHOOK_SECRET: ""
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Started only with `--profile telegram-bot`. Long polling: no port, no
  # webhook route. Exactly ONE replica per bot token: the worker holds a
  # PostgreSQL advisory lock plus a lease and exits if another consumer runs.
  # The token lives only in .env.telegram (mode 600), so web and catalog-web
  # never receive it.
  telegram-bot:
    profiles: ["telegram-bot"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Plain manage.py: migrations and collectstatic belong to the web release.
    entrypoint: ["python", "manage.py"]
    command: ["run_telegram_bot"]
    env_file:
      - path: .env
      - path: .env.telegram
        required: false
    environment:
      # The bot never uses AI support and has none of its mounts; the shared
      # .env enables AI support for web only.
      AI_SUPPORT_ENABLED: "false"
      # It delivers employees' notifications about MAX requests through Telegram,
      # which needs the MAX tables but never the MAX token or webhook secret.
      MAX_BOT_TOKEN: ""
      MAX_WEBHOOK_SECRET: ""
      # Telegram is reached only through the dedicated egress proxy on the
      # internal telegram-egress bridge (deploy/telegram-egress). An empty
      # TELEGRAM_API_PROXY_URL in the invoking shell means a direct connection.
      TELEGRAM_API_PROXY_URL: "${TELEGRAM_API_PROXY_URL-http://10.231.0.1:2081}"
    volumes:
      - media:/app/mediafiles:ro
      - private_media:/app/private_media:ro
    networks:
      default: {}
      telegram-egress:
        ipv4_address: 10.231.0.2
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p=os.environ.get('TELEGRAM_BOT_HEARTBEAT_FILE','/tmp/denstock-telegram-bot.heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 90 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Started only with `--profile max-bot`. Sends the MAX outbox and fans out
  # operator events; MAX updates arrive at web's webhook, so no port. Exactly
  # ONE replica: the worker holds a PostgreSQL advisory lock plus a lease.
  # The token lives only in .env.max (root, mode 600), with MAX_API_CA_FILE and
  # MAX_API_CA_SHA256: MAX's certificate chains to the Russian Trusted Root CA,
  # which only this service trusts, from the read-only public certificate
  # directory mounted below. MAX is reached directly: no Telegram egress
  # network, no AI proxy, no proxy environment.
  max-bot:
    profiles: ["max-bot"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "manage.py"]
    command: ["run_max_bot"]
    env_file:
      - path: .env
      - path: .env.max
        required: false
    environment:
      AI_SUPPORT_ENABLED: "false"
      # The webhook secret belongs to web; the Telegram secret to telegram-bot.
      MAX_WEBHOOK_ENABLED: "false"
      MAX_WEBHOOK_SECRET: ""
      TELEGRAM_BOT_TOKEN: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      MAX_BOT_HEARTBEAT_FILE: /tmp/denstock-max-bot.heartbeat
    volumes:
      - media:/app/mediafiles:ro
      - private_media:/app/private_media:ro
      - type: bind
        source: ${DENSTOCK_MAX_CA_DIR:-/etc/denstock/max}
        target: /etc/denstock/max
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 40s
    healthcheck:
      # Heartbeat fresh, naming a worker, and the database lease is that worker's.
      test: ["CMD", "python", "manage.py", "max_bot_health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: caddy:2
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
      CADDY_PUBLIC_CATALOG_HOST: ${CADDY_PUBLIC_CATALOG_HOST:-catalog.localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro            # Caddy отдаёт /media/* из этого тома (Слой 25)
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  media:
  private_media:
  caddy_data:
  caddy_config:

networks:
  # Only telegram-bot joins it. Internal: no route to the outside through this
  # bridge; it exists so the bot, and nothing else, can reach the Telegram egress
  # proxy listening on its gateway (see deploy/telegram-egress).
  telegram-egress:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-tg-egress
    ipam:
      config:
        - subnet: 10.231.0.0/29
          gateway: 10.231.0.1
